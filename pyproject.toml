[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suax"
version = "2.1.0"
description = "Squared-Up Above Expected: bat-speed-adjusted barrel accuracy from Statcast bat tracking"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["baseball", "statcast", "sabermetrics", "bat-tracking", "mlb"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "scikit-learn>=1.3",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
data = ["pybaseball>=2.2"]
viz = ["matplotlib>=3.6"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
suax = "suax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end tests that fit models (deselect with -m 'not slow')"]
